name: GitHub Actions Demo

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'

  pull_request:
    branches: [main]

  schedule:
    - cron: '15 6 * * 0'

  workflow_dispatch:

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Vypis udalost a vetev
        run: |
          echo "Udalost: $GITHUB_EVENT_NAME"
          echo "Vetev nebo reference: $GITHUB_REF"

      - name: Stahni soubory repozitare
        uses: actions/checkout@v4

      - name: Vypis soubory repozitare
        run: git ls-files


        
